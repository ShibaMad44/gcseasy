<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="GCSE revision on GCSEasy.">
<link rel="canonical" href="https://gcseasy.pages.dev/subject.html">
<meta property="og:title" content="GCSEasy">
<meta property="og:description" content="GCSE revision on GCSEasy.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gcseasy.pages.dev/subject.html">
<meta name="theme-color" content="#F3F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming soon · GCSEasy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="shared/study.css">
<link rel="stylesheet" href="shared/site.css">
<script src="shared/config.js"></script>
<script src="shared/site.js"></script>
<style>
.soon{display:grid;gap:28px}
.shead{display:flex;gap:16px;align-items:center}
.shead .tile{width:64px;height:64px;font-size:25px;border-color:var(--c);color:var(--c)}
.shead h1{font-size:2rem}
.status{display:inline-block;margin-top:6px;font:700 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.box h2{font-size:1.15rem;margin-bottom:8px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;list-style:none;padding:0;margin:0}
.feat li{margin:0;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-family:var(--display);color:var(--muted)}
.tips{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.tips li{margin:0;padding-left:26px;position:relative}
.tips li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:8px;border-radius:2px;background:var(--hl)}
.others{display:flex;flex-wrap:wrap;gap:8px}
.others a{font:700 .88rem var(--display);text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px}
.others a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<header class="sitebar"><div class="in"><a class="brand" href="index.html" aria-label="GCSEasy home">GCS<mark>Easy</mark></a><nav class="sitenav" aria-label="Site"><a href="index.html#subjects" aria-current="page">Subjects</a><a href="tools.html">Study tools</a><a href="resources.html">Resources</a><button class="themebtn" type="button" data-theme-toggle><i></i></button></nav></div></header>
<div class="wrap" style="padding-top:22px">
<p class="crumbs" id="crumbs"><a href="index.html#subjects">Subjects</a></p>
<div class="soon" id="soon"></div>
</div>
<footer class="sitefoot"><div class="in"><span class="brand">GCS<mark>Easy</mark></span><nav aria-label="Footer"><a href="index.html#subjects">Subjects</a><a href="tools.html">Study tools</a><a href="resources.html">Resources</a><a href="index.html#papers">Past papers</a></nav><p>Free GCSE revision. Questions are original and written in the style of the real exams. Not affiliated with any exam board. Your progress is saved only in your browser.</p></div></footer>
<script>
function render(){
  const {SUBJECTS,CATS}=GCSEasy;
  const id=location.hash.slice(1);
  let s=SUBJECTS.find(x=>x.id===id);
  if(s&&s.live){location.replace(s.href);return}
  const box=document.getElementById("soon");
  if(!s){box.innerHTML=`<div><h1>Subject not found</h1><p>Choose a subject from the <a href="index.html#subjects">subjects list</a>.</p></div>`;return}
  const cat=CATS.find(c=>c[0]===s.cat)[1];
  document.title=s.name+" · GCSEasy";
  document.getElementById("crumbs").innerHTML=`<a href="index.html#subjects">Subjects</a> / ${cat}`;
  const live=SUBJECTS.filter(x=>x.live);
  box.style.setProperty("--c",`var(${s.c})`);
  box.innerHTML=`
  <div class="shead"><div class="tile"><small>${s.code[0]}</small>${s.code}</div><div><h1>${s.name}</h1><p class="sub" style="margin:2px 0 4px">${s.board}</p><span class="status">Coming soon</span></div></div>
  <div class="box"><h2>What this page will have</h2><ul class="feat"><li>Topic notes</li><li>Flashcards</li><li>Answer technique</li><li>Exam questions with mark schemes</li></ul></div>
  <div class="box"><h2>Start revising now</h2><ul class="tips">${(s.tips||[]).map(t=>`<li>${t}</li>`).join("")}</ul>
    <p style="margin-top:12px"><a href="${s.papers}" target="_blank" rel="noopener">${s.exam==="Board TBC"?"Find past papers":"Find "+s.exam+" past papers and mark schemes"} →</a></p></div>
  <div><h2 style="font-size:1.15rem;margin-bottom:10px">Ready now</h2><div class="others">${live.map(x=>`<a href="${x.href}">${x.name}</a>`).join("")}<a href="tools.html">Study tools</a></div></div>`;
}
render();window.addEventListener("hashchange",render);
</script>
</body>
</html>
