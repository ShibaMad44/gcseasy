name: Daily reminders
# Every hour, ask the site to send any reminders that are due. Each person gets at most one a day.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        run: |
          curl -sS -X POST -H "Content-Type: application/json" -d "{}" "https://gcseasy.pages.dev/api/push/run"
